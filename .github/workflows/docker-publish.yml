name: Build and Publish Dev Container

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'Dockerfile'
      - 'wpilib.version'
      - 'scripts/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      wpilib_version:
        description: WPILib version to build (empty to use wpilib.version)
        type: string
        required: false
        default: ''
      moving_tags:
        description: Moving tags to update (only applies to stable versions, on develop)
        type: choice
        options:
          - none
          - major
          - major-and-latest
        default: none

# One publish at a time, in arrival order, so an older run cannot move latest or the major tag
# after a newer one.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: npmanos/devcontainer_wpilib
  # Preferred name. The images are built and pushed by digest under IMAGE_NAME; the manifests are
  # tagged under both names. IMAGE_NAME stays published for backwards compatibility.
  IMAGE_NAME_ALIAS: npmanos/devcontainer-wpilib

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve WPILib version
        env:
          INPUT_VERSION: ${{ inputs.wpilib_version }}
        run: |
          version="${INPUT_VERSION:-$(cat wpilib.version)}"
          bash scripts/version-info.sh "$version" > /dev/null
          echo "WPILIB_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push by Digest (Avoids race conditions on tags)
      - name: Build and push java by digest
        id: build_java
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: java
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          build-args: |
            WPILIB_VERSION=${{ env.WPILIB_VERSION }}
            TARGETARCH=${{ matrix.arch }}

      - name: Smoke test pushed java image
        run: |
          docker run --rm --network none -v "$PWD/scripts:/scripts:ro" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_java.outputs.digest }}" \
            /scripts/smoke-test.sh java

      - name: Export java digest
        run: |
          mkdir -p /tmp/digests/java
          digest="${{ steps.build_java.outputs.digest }}"
          touch "/tmp/digests/java/${digest#sha256:}"

      - name: Upload java digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-java-${{ matrix.arch }}
          path: /tmp/digests/java/*
          if-no-files-found: error
          retention-days: 1

      # Build and Push by Digest (Avoids race conditions on tags)
      - name: Build and push full by digest
        id: build_full
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: full
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: |
            WPILIB_VERSION=${{ env.WPILIB_VERSION }}
            TARGETARCH=${{ matrix.arch }}

      - name: Smoke test pushed full image
        run: |
          docker run --rm --network none -v "$PWD/scripts:/scripts:ro" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_full.outputs.digest }}" \
            /scripts/smoke-test.sh full

      - name: Export full digest
        run: |
          mkdir -p /tmp/digests/full
          digest="${{ steps.build_full.outputs.digest }}"
          touch "/tmp/digests/full/${digest#sha256:}"

      - name: Upload full digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-full-${{ matrix.arch }}
          path: /tmp/digests/full/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - variant: full
            suffix: ""
          - variant: java
            suffix: "-java"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Classify version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.wpilib_version }}
        run: |
          version="${INPUT_VERSION:-$(cat wpilib.version)}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bash scripts/version-info.sh "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes to develop move the major and latest tags for stable versions. A dispatch moves them
      # only as chosen in moving_tags, and never from a branch other than develop.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_ALIAS }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}${{ matrix.suffix }}
            type=raw,value=${{ steps.version.outputs.major }}${{ matrix.suffix }},enable=${{ steps.version.outputs.stable == 'true' && github.ref == 'refs/heads/develop' && (github.event_name != 'workflow_dispatch' || inputs.moving_tags != 'none') }}
            type=raw,value=latest${{ matrix.suffix }},enable=${{ steps.version.outputs.stable == 'true' && github.ref == 'refs/heads/develop' && (github.event_name != 'workflow_dispatch' || inputs.moving_tags == 'major-and-latest') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          refs=()
          for file in *; do
            refs+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:$file")
          done
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${refs[@]}"
