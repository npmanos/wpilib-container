name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run script tests
        run: bash tests/run-all.sh

      - name: Read WPILib version
        run: echo "WPILIB_VERSION=$(cat wpilib.version)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build java image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: java
          platforms: linux/arm64
          push: false
          load: true
          tags: wpilib-test:java
          cache-from: type=gha,scope=linux/arm64
          build-args: |
            WPILIB_VERSION=${{ env.WPILIB_VERSION }}
            TARGETARCH=arm64

      - name: Build full image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: full
          platforms: linux/arm64
          push: false
          load: true
          tags: wpilib-test:full
          cache-from: type=gha,scope=linux/arm64
          build-args: |
            WPILIB_VERSION=${{ env.WPILIB_VERSION }}
            TARGETARCH=arm64

      - name: Smoke test java image
        run: docker run --rm --network none -v "$PWD/scripts:/scripts:ro" wpilib-test:java /scripts/smoke-test.sh java

      - name: Smoke test full image
        run: docker run --rm --network none -v "$PWD/scripts:/scripts:ro" wpilib-test:full /scripts/smoke-test.sh full
